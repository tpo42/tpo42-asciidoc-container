# lefthook.yml — tpo42-asciidoc-container
#
# Derived from the qa-ready catalog, pruned to what this repository actually carries:
# shell (the dominant artefact), one Containerfile, GitHub workflows, Markdown, AsciiDoc
# ADRs and one requirement. No Python, no C, no XML, no TOML — so ruff, clang-tidy,
# xmllint and taplo are not wired here. Add them from references/catalog.md when such a
# file appears.
#
# INVARIANT — no container reference in this file.
# Jobs name tools. The {template} placeholders decide where those tools come from:
#   empty (as below)      → the tool runs natively. This is the GitHub Actions case;
#                           GitHub runs VMs, so the workflow installs the tools.
#   filled in lefthook-local.yml → the tool runs in a container. This is the framework
#                           developer case; README.md, "Local lefthook Setup".
# Never both, and never nested: starting a container from inside a container does not
# work — paths do not resolve and the socket belongs to another namespace. Dispatch
# therefore belongs to the calling layer, not to this file.
#
# A template expands to a *prefix* that ends before the tool name, so images used here
# must not set an ENTRYPOINT that supplies the binary.

# The current release, not the oldest one that happens to parse this file. An older
# lefthook swallows an unknown key without a word, so a version floor that lags a key
# used here turns a gate into a no-op nobody is told about.
min_version: 2.1.10

# Empty strings, not empty keys: a key without a value is YAML null, and lefthook's
# schema wants a string here — `lefthook validate` rejects null while expanding it to the
# same nothing at run time. "" says "no prefix" in a way the validator also accepts.
templates:
  # domain bucket — the AsciiDoc toolchain. Here that is the image this repository
  # delivers, reached through its own wrapper, so the gate exercises the product.
  adoc: ""
  # mini bucket — fast, non-build checks
  mini: ""

pre-commit:
  parallel: true
  # Formatters below write; this is what makes them a gate anyway. lefthook compares the
  # tracked files before and after, so a correction fails the commit and stays unstaged
  # for review — deliberately not `stage_fixed`, which would commit it unseen.
  fail_on_changes: "always"
  fail_on_changes_diff: true
  jobs:

    # ---------------------------------------------------------------- mini bucket

    # Whitespace, EOL and charset for every language from one SSOT (.editorconfig).
    - name: editorconfig
      tags: [mini, format]
      glob: "*"
      run: "{mini} ec {staged_files}"

    # Shell is selected by MIME type, not by extension. bin/adcw and bin/adcbw carry no
    # suffix — a glob would have to name them one by one and would miss the next script
    # someone adds. libmagic reads the shebang instead, so `text/x-shellscript` catches
    # every real script wherever it lives.
    - name: shellcheck
      tags: [mini, shell]
      file_types: ["text/x-shellscript"]
      run: "{mini} shellcheck -x {staged_files}"

    # The companion case: a file meant to be *sourced* may have no shebang, and then
    # libmagic reports text/plain — lib/completions/adcw.bash is exactly that. It needs
    # the dialect stated explicitly, which is why this is a separate job rather than a
    # wider filter: -s bash is wrong for the scripts above, whose shebang decides.
    # lefthook ANDs its filters, so a MIME-or-glob union cannot be one job anyway.
    # Files carrying both a .bash suffix and a shebang are checked twice; that costs
    # milliseconds and is the safe direction to err in.
    # .bats belongs here for the same reason .bash does: no shebang decides the dialect.
    # shellcheck parses bats' `@test "name" { … }` as an ordinary function definition, so
    # the suites are linted like everything else rather than being a blind spot the size
    # of the test tree.
    - name: shellcheck-sourced
      tags: [mini, shell]
      glob: "*.{bash,bats}"
      run: "{mini} shellcheck -x -s bash {staged_files}"

    # -i 4 matches the existing scripts and is the SSOT for shell style — .editorconfig
    # deliberately does not carry indent_style for shell (see the catalog note on SPOT).
    - name: shfmt
      tags: [mini, shell, format]
      file_types: ["text/x-shellscript"]
      run: "{mini} shfmt -w -i 4 {staged_files}"

    # zsh completions are not shell in shellcheck's sense: it refuses the dialect
    # outright ("Unknown shell: zsh", upstream #809). `zsh -n` is the interpreter's own
    # parser — a syntax gate, not a linter. It is what exists today; z-shell/zsh-lint is
    # the candidate for more, once it ships a release binary.
    - name: zsh-syntax
      tags: [mini, shell]
      glob: "lib/completions/_*"
      run: "{mini} zsh -n {staged_files}"

    # Ruby arrived with container/resources/extract-diagrams.rb, which is what the
    # catalog's "wire when there is actual .rb code" was waiting for. -a only: the safe
    # autocorrections. -A rewrites semantics and has no business in a hook.
    - name: rubocop
      tags: [mini, ruby]
      glob: "*.rb"
      run: "{mini} rubocop -a --force-exclusion {staged_files}"

    - name: yamllint
      tags: [mini, yaml]
      glob: "*.{yml,yaml}"
      run: "{mini} yamllint {staged_files}"

    # Workflow structure against the vendored SchemaStore definition. Complements
    # actionlint rather than duplicating it: this one knows which keys may appear where,
    # the other knows what the values mean.
    - name: workflow-schema
      tags: [mini, ci]
      glob: ".github/workflows/*.{yml,yaml}"
      run: "{mini} check-jsonschema --builtin-schema vendor.github-workflows {staged_files}"

    - name: dependabot-schema
      tags: [mini, ci]
      glob: ".github/dependabot.{yml,yaml}"
      run: "{mini} check-jsonschema --builtin-schema vendor.dependabot {staged_files}"

    # Workflow semantics — expressions, runner labels, action inputs.
    - name: actionlint
      tags: [mini, ci]
      glob: ".github/workflows/*.{yml,yaml}"
      run: "{mini} actionlint {staged_files}"

    # Compose semantics (key order, name field) — complementary to yamllint. Matches
    # qa-compose.yml and the compose fixture the test suite parses.
    - name: dclint
      tags: [mini, compose]
      glob: "*compose*.{yml,yaml}"
      run: "{mini} dclint {staged_files}"

    # This repository's whole purpose is a container image, so it lints its own recipes —
    # both the delivered one and the fleet's.
    - name: hadolint
      tags: [mini, docker]
      # `*` crosses `/` here and matches the empty string, so one pattern per suffix
      # covers a file at the root and in any directory — measured against lefthook
      # 2.1.10 rather than assumed. Note what this does *not* need: no `**/` prefix,
      # which would require a directory and skip a Containerfile at the root, and no
      # `*.Containerfile`, which insists on a dot that `container/Containerfile` has
      # nowhere to put.
      glob: "{*Containerfile,*Dockerfile,*.dockerfile}"
      run: "{mini} hadolint {staged_files}"

    # Line wrapping is left as written: reflowed prose turns a one-word edit into a
    # paragraph-sized diff. Everything else — list markers, emphasis, code fences,
    # heading style — is normalised. --number keeps ordered lists numbered as written.
    # mdformat-frontmatter is why the YAML header of .claude/skills/adcw/SKILL.md
    # survives untouched.
    - name: mdformat
      tags: [mini, markdown, format]
      glob: "*.md"
      run: "{mini} mdformat --number {staged_files}"

    # git-native, so deliberately without a template: git is part of the host floor.
    - name: merge-markers
      tags: [mini]
      run: git diff --check

    # Commits are allowed on main and on feature/, hotfix/ and release/ branches,
    # nowhere else.
    - name: guard-branch
      tags: [mini]
      run: |
        branch="$(git branch --show-current)"
        [ -z "$branch" ] && exit 0
        case "$branch" in
          main|feature/*|hotfix/*|release/*) exit 0 ;;
        esac
        echo "commit on '$branch' refused — use main, feature/…, hotfix/… or release/…"
        exit 1

    # Secret gate on the staged change. gitleaks needs no baseline to maintain.
    - name: gitleaks
      tags: [mini, secrets]
      run: "{mini} gitleaks protect --staged --redact --no-banner --source ."

    # A file starting with #! must be executable, and an executable file must start
    # with #! — pre-commit ships these as check-shebang-scripts-are-executable and
    # check-executables-have-shebangs, and the catalog's answer for both is a shell
    # command rather than a framework.
    #
    # Both directions are wired because both have bitten: the first found three files
    # whose mode contradicted their shebang, one of them a command script whose missing
    # bit container/Containerfile was papering over with a chmod after COPY. The second
    # catches the reverse — a data file that picked up +x by accident.
    #
    # head -c2 rather than libmagic: the question is literally "do the first two bytes
    # read #!", and file(1) would answer a broader question less precisely.
    #
    # The mode comes from git, not from `test -x`, and that is not fussiness. A macOS
    # bind mount presents every file to the container as executable, so `test -x` inside
    # {mini} answers yes for .gitignore and README.md alike — measured, not feared. Git
    # stores 100644 or 100755 and reports the same answer on every host, which is also
    # the only mode that will ever reach anyone else.
    #
    # This wants to be a small script rather than an inline blob; it is inline for now.
    - name: shebang-exec-match
      tags: [mini]
      glob: "*"
      run: |
        {mini} sh -c '
          rc=0
          for f in "$@"; do
            [ -f "$f" ] || continue
            mode=$(git ls-files --stage -- "$f" | cut -d" " -f1)
            [ -n "$mode" ] || continue
            if [ "$(head -c2 "$f" 2>/dev/null)" = "#!" ]; then
              [ "$mode" = "100755" ] || { echo "shebang but not executable: $f"; rc=1; }
            elif [ "$mode" = "100755" ]; then
              echo "executable but no shebang: $f"; rc=1
            fi
          done
          exit $rc
        ' sh {staged_files}

    # Binary artefacts by type, not by size.
    - name: artifact-guard
      tags: [mini]
      glob: "*.{jar,so,a,o,elf,bin,exe,dll,class,pyc}"
      run: |
        echo "Binary/artifact file(s):"; printf '  %s\n' {staged_files}
        echo "Intentional? Then allow via .gitattributes — otherwise remove."
        exit 1

    # ---------------------------------------------------------------- host floor

    # The existing suite sources bin/adcw and exercises its internals. Deliberately
    # without a template: it asserts on how the wrapper behaves *on a host* — which
    # container runtime it finds, what it reports when an image is missing. Running it
    # inside the mini container would test a machine nobody uses.
    #
    # test/run-suite.bash rather than `bats`: the wrapper's shebang is /bin/bash, so that
    # is the interpreter its users actually get — on macOS still 3.2.57, where every
    # bash 4 construct parses cleanly under `bash -n` and only fails when the code runs.
    # A static gate cannot cover that; executing the suite under the platform's system
    # bash is the only thing that does, and bats' own `#!/usr/bin/env bash` would quietly
    # pick a brewed 5.x instead. The wrapper is the seam that pins it (ADR-010).
    - name: unit-tests
      tags: [test, shell]
      glob: "{bin/*,lib/**,test/unit/*.bats,test/run-suite.bash,test/test_helper/*.bash}"
      run: test/run-suite.bash test/unit

    # -------------------------------------------------------------- domain bucket

    # Dispatched through bin/adcw, not through a compose service: the wrapper resolves
    # the image tag from git, so the gate always validates against the image built from
    # the current branch — and running the wrapper on every commit is itself the test
    # that keeps it working.
    #
    # Addressed at the compile units, of which this repository has two directories'
    # worth: adr/ and req/. Every file there is self-contained, so unlike a chapter-based
    # documentation repository there is no fragment-versus-unit distinction to make.
    #
    # Globs, not directories: validate resolves an -i argument as a glob pattern or as an
    # existing file, and a bare `adr/` is neither. Single-quoted so the pattern reaches
    # validate unexpanded — it does its own find.
    #
    # --strict turns a pattern that matches nothing into a failure instead of a skip. How
    # much stricter this gate should be (--verbose, --failure-level INFO) is a separate
    # question from getting it wired.
    #
    # ADOC_VERSION is pinned rather than left to git describe. The derived tag carries a
    # -dirty suffix whenever the working tree differs from HEAD, which is true inside a
    # pre-commit hook and false a second later — the gate would need one image per state
    # and break on whichever it was not built for. A fixed tag mirrors the mini fleet's
    # :local image: rebuilt deliberately, by the same hand that changed the recipe.
    - name: adoc-validate
      tags: [domain, asciidoc]
      glob: "*.adoc"
      env:
        ADOC_VERSION: local
      run: "{adoc} validate -i 'adr/*.adoc' -i 'req/*.adoc' --strict"


# The regression suites live here rather than in pre-commit because they cost a
# container start per case — seconds, not milliseconds. A pre-commit hook runs on every
# `git commit --amend`, so an interactive rebase over seven commits would pay for them
# seven times while the tool under test never changed. Pushing is the last moment where
# paying is still useful, and nothing stops anyone from running them by hand:
#
#   lefthook run pre-push --all-files
#
# They drive bin/adcw, which starts the container itself, so they carry no template —
# dispatching them into one would nest containers.
pre-push:
  parallel: true
  jobs:

    # One fixture per defect class validate is supposed to catch, plus a clean control
    # and a check that --no-diagrams really opts out.
    - name: validate-cases
      tags: [domain, asciidoc, test]
      glob: "{container/resources/validate.sh,test/validate-cases.bats,test/run-suite.bash,test/test_helper/*.bash,test/fixtures/validate/*,bin/adcw}"
      run: test/run-suite.bash test/validate-cases.bats

    # Both block delimiters, the mixed document, the empty one, rendering through the
    # gem's PlantUML jar, and the type this image does not render.
    - name: extract-diagrams-cases
      tags: [domain, asciidoc, test]
      glob: "{container/resources/extract-diagrams.rb,test/extract-diagrams-cases.bats,test/run-suite.bash,test/test_helper/*.bash,test/fixtures/extract-diagrams/*,bin/adcw}"
      run: test/run-suite.bash test/extract-diagrams-cases.bats


# Advisory, not a gate — hence groups of their own rather than a job in pre-push. The
# review is not deterministic: same input, a finding one time and none the next. As a
# gate it would be the reason --no-verify becomes a habit, taking the regression suites
# above down with it. Never attached automatically; whoever wants it, calls it.
#
# No template: claude runs on the host, like git, /bin/bash and the unit tests.
# Dispatching it into the mini container would mean carrying the login in there.
#
# No explicit ref range: /code-review defaults to the commits ahead of the upstream *and*
# the unstaged worktree. That is the right scope for the moment before a commit, where
# the correction is still an --amend rather than a fixup. Before a push the same scope is
# a superset — which does no harm on an advisory run.
#
# Groups named after the moment they suit, rather than one matrix. What the levels and
# models actually do, read out of the CLI on 2026-08-13, derivation in issues/:
#
# /code-review pins no model of its own — finders and verifiers inherit the session
# model, so --model is the only lever. The prompt cell is then chosen by model family ×
# level, and not every family has a measured cell of its own; the rest fall back to a
# generic full fan-out of 8 finder angles x 6 candidates. That fallback is what let one
# run burn a whole token window in ten minutes without delivering a result.
#
# medium is tuned for precision ("every finding one a maintainer would act on"), high for
# recall. On opus both point at the same cell, so high is wasted there — more breadth
# starts at xhigh.
#
# No `|| true` after claude: a missing login or a broken CLI should speak up. Only the
# absence of the tool itself is a legitimate reason to stay quiet — CI and foreign clones
# have no claude and must not fail over it.

# before the commit: fast and precise, few false alarms
review:
  jobs:
    - name: claude-review
      tags: [review]
      skip: &no-claude
        - run: "! command -v claude >/dev/null 2>&1"
      run: claude --model sonnet -p '/code-review medium'

# before the push: same level, the stronger model
review-deep:
  jobs:
    - name: claude-review
      tags: [review]
      skip: *no-claude
      run: claude --model opus -p '/code-review medium'

# before a release or a merge: 10 finder angles plus a sweep, tuned for recall. This is
# the run that costs a noticeable share of a token window.
review-full:
  jobs:
    - name: claude-review
      tags: [review]
      skip: *no-claude
      run: claude --model opus -p '/code-review xhigh'

# A family without a measured cell, so this runs the generic fan-out described above. It
# surfaced the heaviest finding of the calibration and is also the one that ran away on
# cost — worth having, worth watching, hence its own group rather than a default.
review-intens:
  jobs:
    - name: claude-review
      tags: [review]
      skip: *no-claude
      run: claude --model fable -p '/code-review medium'

commit-msg:
  jobs:
    - name: gitlint
      tags: [mini, commit]
      run: "{mini} gitlint --msg-filename {1}"
