name: Build, validate and publish container image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to publish (e.g. v1.2.3)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Derived from the owner, not hardcoded. Upstream that is tpo42/adoc, unchanged. In a
  # fork it is the contributor's own namespace — which is the point: roughly all
  # contributions arrive as forks, only the organisation can push to tpo42, and a fork's
  # build should land somewhere its author can actually use it.
  IMAGE_NAME: ${{ github.repository_owner }}/adoc
  MERMAID_IMAGE_NAME: ${{ github.repository_owner }}/adoc-with-mermaid
  # The two test images, named so that the wrappers resolve them from their own
  # variables: an empty ADOC_REGISTRY yields the bare local name, and ADOC_VERSION
  # supplies the tag. Nothing has to pass an explicit ADOC_IMAGE.
  TEST_TAG: adoc:ci-${{ github.sha }}
  TEST_TAG_MERMAID: adoc-with-mermaid:ci-${{ github.sha }}
  ADOC_REGISTRY: ""
  ADOC_VERSION: ci-${{ github.sha }}

jobs:
  build:
    # A branch in this repository is already built by its push, so a pull request opened
    # from one would run this workflow a second time over the same commit — twice the
    # runner minutes and two rows in the checks list saying the same thing. A pull
    # request from a fork is the case the trigger exists for: its push ran in the fork,
    # under the fork's Actions settings, which may be switched off entirely.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The suites live behind git submodules (bats-core and its assertion
          # helpers, ADR-010); without this they are absent and the gate fails
          # with a missing-directory error rather than a test result.
          submodules: recursive

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # target is not optional: the Containerfile carries two stages, and without it
      # buildx builds the last one — the variant with a browser in it.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          target: adoc
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both variants, always. The Mermaid renderer exists only here, so a suite that
      # skips this image never exercises it — and the case that broke silently was
      # exactly a renderer nobody ran.
      - name: Build the Mermaid variant for testing
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          target: adoc-with-mermaid
          load: true
          tags: ${{ env.TEST_TAG_MERMAID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test script syntax
        run: |
          bash -n bin/adcw
          bash -n bin/adcbw
          bash -n lib/adcw-common.bash
          echo "Syntax OK"

      - name: Test adcw
        run: test/run-suite.bash test/unit

      # Through bin/adcw rather than a hand-written `docker run`. The wrapper knows to
      # run as the invoking user, and the image built here carries the default uid 1000
      # while the workspace belongs to the runner — validate renders diagrams into the
      # workspace, so without that it cannot write. Writing the invocation out a second
      # time here would be a second thing to keep in step with the wrapper.
      #
      # The runtime is pinned to docker because that is where buildx put the image; the
      # wrapper would otherwise prefer podman, which has its own store and would not
      # find it.
      - name: Validate ADRs
        run: |
          _ADCW_CONTAINER_RUNNER_BIN="$(command -v docker)" \
            ./bin/adcw validate --strict -i 'adr/*.adoc'

      # The suites that need an image, against the two just built. Mermaid is required
      # rather than skippable here: this is the one place both variants exist, so a skip
      # would mean the renderer is never exercised anywhere.
      - name: Regression suites
        env:
          ADCW_TEST_REQUIRE_MERMAID: "1"
        run: |
          _ADCW_CONTAINER_RUNNER_BIN="$(command -v docker)"
          export _ADCW_CONTAINER_RUNNER_BIN
          test/run-suite.bash test/validate-cases.bats
          test/run-suite.bash test/extract-diagrams-cases.bats

      - name: Resolve version from tag
        id: version
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          # The patch component is read and dropped: only the floating major and
          # major.minor tags are published alongside the exact version.
          IFS='.' read -r MAJOR MINOR _ <<< "${VERSION}"
          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MAJOR}.${MINOR}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.minor != '' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.major != '' }}
            type=ref,event=branch
            type=sha

      - name: Build and push (multi-platform)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          target: adoc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Mermaid variant, published beside the toolchain rather than inside it
      # (ADR-008). Same stages, same cache, same tag scheme — a consumer picking
      # ghcr.io/tpo42/adoc-with-mermaid:0 gets the same toolchain version they would
      # get from ghcr.io/tpo42/adoc:0, plus a browser.
      - name: Extract metadata for the Mermaid variant
        if: github.event_name != 'pull_request'
        id: meta-mermaid
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MERMAID_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.minor != '' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.major != '' }}
            type=ref,event=branch
            type=sha

      - name: Build and push the Mermaid variant (multi-platform)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          target: adoc-with-mermaid
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-mermaid.outputs.tags }}
          labels: ${{ steps.meta-mermaid.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
