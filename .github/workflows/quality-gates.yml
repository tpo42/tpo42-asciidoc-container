# Quality gates — the same fleet a developer runs locally, on the same containers.
#
# Two jobs, split by what each platform can actually see.
#
# `gates` (Linux) carries everything that needs a container. A runner is a VM, so the
# tools could be installed natively; they are not, on purpose — a dozen tools installed
# by hand would drift from qa-compose.yml, and that drift is what the mini image exists
# to prevent. The runner needs one native tool, lefthook, and everything else is
# version-identical with a developer machine.
#
# `host-gates` (macOS) carries the shell floor, natively. This is not redundancy. The
# wrappers run on the *host*, their shebang is /bin/bash, and on macOS that is still
# 3.2.57 — Apple froze it at the GPLv2 boundary. `declare -A`, `${var^^}` and `mapfile`
# all parse cleanly under `bash -n` there and fail only at runtime, so no linter and no
# syntax check covers this; only executing the suite under that interpreter does. The
# job also meets BSD userland, which is where `realpath` and `printf %q` differ. GitHub
# macOS runners have no Docker, which is why this job carries the host gates and
# nothing else — and why the suite had to stop assuming a container runtime exists.
#
# lefthook.yml names no container in either case. The Linux job fills its templates the
# same way a developer does, only from a step instead of by hand; the macOS job leaves
# them empty, which is the "tool runs natively" path the file documents.
#
# The range checks — secrets across a series of commits, and one message per commit —
# cannot be expressed as a pre-commit hook at all, and only a pull request has a range.
# On main there is nothing to add: everything there arrived through a pull request that
# was already checked.
---
name: quality gates

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

env:
  LEFTHOOK_VERSION: "2.1.10"
  # gitlint asks git who you are, and a container never sees a ~/.gitconfig. These two
  # feed git's env-based configuration through qa-compose.yml — the same mechanism a
  # developer supplies from .env.
  GIT_USER_NAME: github-actions
  GIT_USER_EMAIL: github-actions@users.noreply.github.com

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The pull-request head, not the synthetic merge commit: the range checks below
      # report on commits an author actually wrote and can amend.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install lefthook
        run: |
          asset="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSL -o lefthook \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${asset}"
          sudo install -m0755 lefthook /usr/local/bin/lefthook
          rm -f lefthook
          lefthook version

      - name: Point the templates at the containers
        run: |
          cat > lefthook-local.yml <<'EOF'
          templates:
            adoc: ./bin/adcw
            mini: docker compose -f qa-compose.yml exec -T tpo42-adc-mini
          EOF

      # The adoc gate validates against the image built from *this* commit, which is the
      # whole point of dogfooding it here rather than pulling a published tag. The tag is
      # pinned to the same value lefthook.yml gives the gate; a runner builds it fresh
      # every time, so "fixed tag" and "image of this commit" do not conflict here.
      - name: Build the delivered image
        env:
          CONTAINER_TAG: local
        run: ./bin/adcbw

      # The runner's identity, so the container writes files this job can still read and
      # rewrite. Passed here rather than as job-level env because it has to be asked for.
      - name: Start the tool container
        run: |
          USER_UID="$(id -u)" USER_GID="$(id -g)" \
            docker compose -f qa-compose.yml up -d --build tpo42-adc-mini

      # {staged_files} is empty on a runner, hence --all-files.
      - name: Run the hook fleet
        run: lefthook run pre-commit --all-files --no-auto-install

      # Everything below needs a range, so it only applies to pull requests. Findings are
      # collected rather than raised on the first one: a contributor should see every
      # message that needs amending in one pass, not one per round trip.
      - name: Check the pull-request range
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          # The checkout is complete (fetch-depth: 0), but the base branch is not among
          # the refs it brings along.
          git fetch --no-tags origin "${BASE_REF}"

          # The tip of the base branch, not the merge base. `tip..HEAD` is exactly what
          # this pull request adds; `merge-base..HEAD` would additionally contain every
          # commit the author pulled in by merging the base branch back into their own,
          # and those are other people's messages to answer for.
          base="FETCH_HEAD"
          rc=0

          echo "== secrets across ${base}..HEAD =="
          # `detect --log-opts` walks every commit's patch, so a secret that was added
          # and later removed is still found. The fleet's own `protect --staged` cannot
          # see that, and on a runner it sees nothing at all.
          docker compose -f qa-compose.yml exec -T tpo42-adc-mini \
            gitleaks detect --log-opts="${base}..HEAD" --redact --no-banner || rc=1

          echo "== commit messages in ${base}..HEAD =="
          # Inside the repository and addressed relatively, because gitlint reads this
          # file from inside a container that only has the workspace bind-mounted. A
          # path from mktemp would exist on the runner and nowhere else. Under .git so
          # the messages never look like working-tree files to the other checks.
          msgdir=".git/tpo42-commit-messages"
          rm -rf -- "${msgdir}"
          mkdir -p "${msgdir}"
          trap 'rm -rf -- "${msgdir}"' EXIT
          # --no-merges: merge commits are not written by hand and are not expected to
          # follow Conventional Commits.
          for commit in $(git rev-list --no-merges "${base}..HEAD"); do
            git log --format=%B -n1 "${commit}" > "${msgdir}/${commit}"
            if ! lefthook run commit-msg --no-auto-install "${msgdir}/${commit}"; then
              echo "::error ::commit message rejected: ${commit}"
              rc=1
            fi
          done

          exit "${rc}"

  host-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lefthook
        run: |
          # uname -m yields arm64 or x86_64, which is exactly how the assets are named.
          asset="lefthook_${LEFTHOOK_VERSION}_MacOS_$(uname -m)"
          curl -fsSL -o lefthook \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${asset}"
          sudo install -m0755 lefthook /usr/local/bin/lefthook
          rm -f lefthook
          lefthook version

      # No lefthook-local.yml: the templates stay empty and the tools run natively,
      # which is the path lefthook.yml documents for exactly this case. zsh ships with
      # macOS; only these two are missing.
      - name: Install the shell tools
        # Unpinned on purpose, and the one place that is true: container/mini.Containerfile
        # pins these so a developer's own loop is reproducible, while brew here floats and
        # meets new checks first. A finding that appears only in this job is therefore
        # expected — it is the early-warning lane, not a broken gate.
        run: brew install shellcheck shfmt

      - name: Record the interpreter under test
        run: /bin/bash --version | head -1

      # --tag shell selects shellcheck, shellcheck-sourced, shfmt, zsh-syntax and the
      # unit tests. The AsciiDoc gate is tagged domain and stays on the Linux job, where
      # the container it needs exists.
      - name: Run the host floor
        run: lefthook run pre-commit --all-files --tag shell --no-auto-install
