name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "${LATEST_TAG}" ]; then
            LATEST_TAG="v0.0.0"
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi
          echo "latest_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit_range=${COMMIT_RANGE}" >> "${GITHUB_OUTPUT}"

          SUBJECTS=$(git log "${COMMIT_RANGE}" --pretty=format:"%s")
          BODIES=$(git log "${COMMIT_RANGE}" --pretty=format:"%b")

          BUMP="none"
          if echo "${SUBJECTS}" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          elif echo "${BODIES}" | grep -q 'BREAKING CHANGE'; then
            BUMP="major"
          elif echo "${SUBJECTS}" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          elif echo "${SUBJECTS}" | grep -qE '^fix(\(.+\))?:'; then
            BUMP="patch"
          fi
          echo "bump=${BUMP}" >> "${GITHUB_OUTPUT}"

      - name: Calculate new version
        if: steps.bump.outputs.bump != 'none'
        id: version
        # LATEST_TAG comes from the tag list, so it is a name somebody chose. Same reason
        # as the steps below: an expression is text-substituted before the shell parses.
        env:
          LATEST_TAG: ${{ steps.bump.outputs.latest_tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)  PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "${NEW_TAG} (${BUMP} bump from ${LATEST_TAG})"

      # The wrapper, for people who install it by hand rather than through the tap.
      # Two files, because bin/adcw sources the lib from ../lib relative to itself —
      # so they have to land as <prefix>/bin/adcw and <prefix>/lib/adcw-common.bash.
      #
      # The version is stamped in here rather than derived at runtime: git describe
      # answers with the contributor's branch, which is never what a consumer wants.
      # Without the leading v, because that is how container-publish tags the images.
      - name: Build the wrapper artefacts
        if: steps.version.outputs.new_tag
        # Through env rather than into the script text: an expression is substituted
        # before the shell runs, and a tag is a name somebody chose.
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -eu
          VERSION="${NEW_TAG#v}"

          mkdir -p dist/bin dist/lib
          cp bin/adcw dist/bin/adcw
          sed -e "s|^_ADCW_RELEASE_VERSION=\"\"$|_ADCW_RELEASE_VERSION=\"${VERSION}\"|" \
            lib/adcw-common.bash > dist/lib/adcw-common.bash

          # A silent no-op here is how a published wrapper ends up asking for a tag that
          # was never pushed, so the substitution is verified rather than assumed.
          grep -qx "_ADCW_RELEASE_VERSION=\"${VERSION}\"" dist/lib/adcw-common.bash || {
            echo "::error ::_ADCW_RELEASE_VERSION anchor not found in lib/adcw-common.bash"
            exit 1
          }

          # And the artefact is asked what it will actually pull, which is the check
          # that would have caught a v-prefix mismatch between wrapper and registry.
          resolved="$(
            unset ADOC_VERSION ADOC_IMAGE ADOC_REGISTRY
            # shellcheck disable=SC1091
            . dist/lib/adcw-common.bash
            _adcw_resolve_image adoc
            printf '%s' "${ADOC_IMAGE}"
          )"
          echo "artefact resolves to: ${resolved}"
          [ "${resolved}" = "ghcr.io/tpo42/adoc:${VERSION}" ] || {
            echo "::error ::resolved ${resolved}, expected ghcr.io/tpo42/adoc:${VERSION}"
            exit 1
          }

      - name: Generate release notes
        if: steps.version.outputs.new_tag
        env:
          RANGE: ${{ steps.bump.outputs.commit_range }}
        run: |
          git log "${RANGE}" --pretty=format:"- %s" > /tmp/release_notes.md
          cat >> /tmp/release_notes.md <<'NOTES'


          ## Installation without the tap

          Both files are needed, and where they go matters — `adcw` finds the
          library at `../lib` relative to itself:

          ```bash
          install -Dm755 adcw              ~/.local/bin/adcw
          install -Dm644 adcw-common.bash  ~/.local/lib/adcw-common.bash
          ```

          The container images for this release are published to
          `ghcr.io/tpo42/adoc` and `ghcr.io/tpo42/adoc-with-mermaid`.
          NOTES

      - name: Create release
        if: steps.version.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --notes-file /tmp/release_notes.md \
            dist/bin/adcw \
            dist/lib/adcw-common.bash

      - name: Trigger container publish with semver tag
        if: steps.version.outputs.new_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run container-publish.yml \
            -f tag=${{ steps.version.outputs.new_tag }}
